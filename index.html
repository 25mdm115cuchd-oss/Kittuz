<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KITTUZ – Premium Women's Lifestyle & Fashion | Elevate Your Everyday</title>
    <meta name="description" content="Elevate your everyday with KITTUZ – India's premier women's lifestyle, fashion, jewellery, and luxury essentials e-commerce destination with AI shopping stylist." />
    <meta name="keywords" content="KITTUZ, women's fashion India, lifestyle e-commerce, designer jewellery, handbags, luxury essentials, style finder, AI stylist" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KITTUZ – Premium Women's Lifestyle & Fashion" />
    <meta property="og:description" content="Discover the little things that make every day extraordinary. Curated women's fashion, jewellery, handbags & luxury essentials." />
    <meta property="og:site_name" content="KITTUZ" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KITTUZ – Premium Women's Lifestyle & Fashion" />
    <meta name="twitter:description" content="Discover the little things that make every day extraordinary. Curated women's fashion, jewellery, handbags & luxury essentials." />

    <!-- Google Fonts for Luxury Editorial Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Razorpay Checkout Integration Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "KITTUZ",
      "alternateName": "Kittuz Lifestyle",
      "description": "Premium Women's Lifestyle, Fashion, Jewellery & Handbags E-Commerce Destination.",
      "url": "https://kittuz.in",
      "logo": "https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=600",
      "priceRange": "₹₹",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://kittuz.in/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-[#1E1B18] antialiased selection:bg-[#F3D5DC] selection:text-[#5F1D2C]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
